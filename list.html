            margin: 0;
            position: absolute;

        .button{
            background-color: #5acee6; /* Green */

            padding: 5px 15px;

            cursor: pointer;
        }
    </style>
    <script>
        function goBack() {

        };
    </script>
    <body style="background-color: #5acee6;">
